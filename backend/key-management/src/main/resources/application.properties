spring.application.name=key-management

# ==============================
# Database
# ==============================

spring.datasource.url=jdbc:mysql://localhost:3306/healthcare_key_management
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ==============================
# JPA
# ==============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==============================
# JWT
# ==============================

jwt.secret=${JWT_SECRET}
jwt.expiration=3600000

# ==============================
# AES Master Key
# ==============================

encryption.key=${AES_MASTER_KEY}

# ==============================
# Key Protection
# ==============================

key.protection.secret=${KEY_PROTECTION_SECRET}

# ==============================
# Key Expiration Scheduler
# ==============================

key.expiration.check-interval-ms=60000

# ==============================
# CORS
# ==============================

app.cors.allowed-origins=http://localhost:5173

# ==============================
# Application
# ==============================

spring.profiles.active=local
server.port=8080